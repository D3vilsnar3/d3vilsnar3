<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08090b;
    color: #d3d7de;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 15px;
    text-align: center;
    padding: 24px;
  }
  a { color: #ffb454; }
  .prompt { color: #62d9a8; }
</style>
</head>
<body>
  <div>
    <p><span class="prompt">$</span> opening scheduler&hellip;</p>
    <p>If nothing happens, <a href="https://cal.com/d3vilsnar3">book a 30-minute call here</a>.</p>
  </div>
